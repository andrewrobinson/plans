<?xml version="1.0" encoding="UTF-8"?>
<!--
  Isometric view of the room, to scale. Plan 2: an upper cupboard on the bench
  (x 500-1200) makes an L with the tall cupboard; the old open shelving is its corner. Viewed from the front-right corner,
  looking towards the back-left corner. The front and right walls and the
  ceiling are left out so the cupboards can be seen.

  Room coordinates in mm: x along the back wall from the left wall,
  y from the back wall towards the front, z up from the floor.
  Projection: X = 0.866 (x - y), Y = 0.5 (x + y) - z.

  Each face is drawn as a rectangle in its own plane, mapped with:
    plane z = h:  matrix(0.866 0.5 -0.866 0.5 0 -h)               (u = x, v = y)
    plane x = k:  matrix(-0.866 0.5 0 -1 0.866k 0.5k)             (u = y, v = z)
    plane y = k:  matrix(0.866 0.5 0 -1 -0.866k 0.5k)             (u = x, v = z)
  Faces are drawn far to near.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-5300 -3000 8900 8000" width="1120" height="1010"
     font-family="Helvetica, Arial, sans-serif">

  <style>
    .e { vector-effect: non-scaling-stroke; stroke-width: 1.2; stroke-linejoin: round; }
    .thin { vector-effect: non-scaling-stroke; stroke-width: 0.8; }
    .dash { vector-effect: non-scaling-stroke; stroke-width: 1; stroke-dasharray: 6 4; fill: none; }
  </style>

  <text x="-5200" y="-2800" font-size="150" font-weight="bold">Room in 3D (isometric): plan 2, open shelves</text>
  <text x="-5200" y="-2620" font-size="85" fill="#555">To scale. Front and right walls and ceiling removed. Room door open 90°, cupboard doors closed. Upper open shelves on the bench, no door.</text>

  <!-- Floor, z = 0 -->
  <g transform="matrix(0.866 0.5 -0.866 0.5 0 0)">
    <rect class="e" x="0" y="0" width="3838" height="5717" fill="#ddd8cc" stroke="#888"/>
  </g>

  <!-- Back wall, y = 0 -->
  <g transform="matrix(0.866 0.5 0 -1 0 0)">
    <rect class="e" x="0" y="0" width="3838" height="2400" fill="#f3f0ea" stroke="#888"/>
  </g>

  <!-- Left wall, x = 0, with the doorway (y 1380-2304, up to 2130) -->
  <g transform="matrix(-0.866 0.5 0 -1 0 0)" fill="#e7e3db" stroke="#888">
    <rect class="e" x="0" y="0" width="1380" height="2400"/>
    <rect class="e" x="2304" y="0" width="3413" height="2400"/>
    <rect class="e" x="1380" y="2130" width="924" height="270"/>
    <!-- Doorway: seen through to beyond -->
    <rect class="e" x="1380" y="0" width="924" height="2130" fill="#b9c3cc"/>
  </g>

  <!-- ===== Open shelving: x 0-500, y 0-500, from 780 to the ceiling, open on x = 500 ===== -->
  <!-- Backing panel behind the shelves: x 0-18, y 0-500, z 780-2400.
       Its visible face is the x = 18 plane, facing the opening. -->
  <g transform="matrix(-0.866 0.5 0 -1 15.6 9)">
    <rect class="e" x="0" y="780" width="500" height="1620" fill="#c9a877" stroke="#5a3f17"/>
  </g>

  <!-- Shelves: base 762-780 in the corner only (the bench is under the rest),
       then 1185, 1590, 1995 running through from x 18 to 1182, open on y = 500 -->
  <g fill="#d6bc8f" stroke="#5a3f17">
    <g transform="matrix(0.866 0.5 -0.866 0.5 0 -780)"><rect class="e" x="18" y="0" width="482" height="500"/></g>
    <g transform="matrix(0.866 0.5 -0.866 0.5 0 -1203)"><rect class="e" x="18" y="0" width="1164" height="500"/></g>
    <g transform="matrix(0.866 0.5 -0.866 0.5 0 -1608)"><rect class="e" x="18" y="0" width="1164" height="500"/></g>
    <g transform="matrix(0.866 0.5 -0.866 0.5 0 -2013)"><rect class="e" x="18" y="0" width="1164" height="500"/></g>
  </g>

  <!-- ===== Back bench: x 500-3838, y 0-500, z 0-780 ===== -->
  <!-- Front, y = 500 -->
  <g transform="matrix(0.866 0.5 0 -1 -433 250)">
    <rect class="e" x="500" y="0" width="3338" height="780" fill="#d9c3a0" stroke="#7a5c2e"/>
  </g>
  <!-- Right end, x = 3838 -->
  <g transform="matrix(-0.866 0.5 0 -1 3323.7 1919)">
    <rect class="e" x="0" y="0" width="500" height="780" fill="#c7ae86" stroke="#7a5c2e"/>
  </g>
  <!-- Top, z = 780 -->
  <g transform="matrix(0.866 0.5 -0.866 0.5 0 -780)">
    <rect class="e" x="500" y="0" width="3338" height="500" fill="#efe2c9" stroke="#7a5c2e"/>
  </g>

  <!-- ===== Upper open shelves on the bench: x 500-1200, y 0-500, z 780-2400, no door ===== -->
  <!-- Shelf front edges, y = 500 -->
  <g transform="matrix(0.866 0.5 0 -1 -433 250)" fill="#b8955e" stroke="#5a3f17">
    <rect class="e" x="500" y="1185" width="682" height="18"/>
    <rect class="e" x="500" y="1590" width="682" height="18"/>
    <rect class="e" x="500" y="1995" width="682" height="18"/>
  </g>
  <!-- End panel, outer face x = 1200 -->
  <g transform="matrix(-0.866 0.5 0 -1 1039.2 600)">
    <rect class="e" x="0" y="780" width="500" height="1620" fill="#bf9c68" stroke="#5a3f17"/>
  </g>
  <!-- End panel and top panel front edges, y = 500 -->
  <g transform="matrix(0.866 0.5 0 -1 -433 250)" fill="#b8955e" stroke="#5a3f17">
    <rect class="e" x="1182" y="780" width="18" height="1620"/>
    <rect class="e" x="500" y="2382" width="700" height="18"/>
  </g>
  <!-- Top, z = 2400 -->
  <g transform="matrix(0.866 0.5 -0.866 0.5 0 -2400)">
    <rect class="e" x="500" y="0" width="700" height="500" fill="#e2cda6" stroke="#5a3f17"/>
  </g>

  <!-- ===== Door cupboard: x 0-500, y 500-1200, z 0-2400 ===== -->
  <!-- Top panel, z = 2400: one piece over the open shelving and the door
       cupboard, x 0-500, y 0-1200, 18 thick -->
  <g transform="matrix(0.866 0.5 -0.866 0.5 0 -2400)">
    <rect class="e" x="0" y="0" width="500" height="1200" fill="#e2cda6" stroke="#5a3f17"/>
  </g>
  <!-- Front end, y = 1200 -->
  <g transform="matrix(0.866 0.5 0 -1 -1039.2 600)">
    <rect class="e" x="0" y="0" width="500" height="2400" fill="#bf9c68" stroke="#5a3f17"/>
  </g>
  <!-- Side with the door, x = 500 -->
  <g transform="matrix(-0.866 0.5 0 -1 433 250)">
    <rect class="e" x="500" y="0" width="700" height="2400" fill="#cfae7c" stroke="#5a3f17"/>
    <!-- Door 694 x 2394, hinged at y = 1200 -->
    <rect class="e" x="503" y="3" width="694" height="2394" fill="#d8bd92" stroke="#5a3f17"/>
    <polyline class="dash" points="503,3 1197,1200 503,2397" stroke="#5a3f17"/>
    <rect x="520" y="950" width="20" height="300" fill="#333"/>
  </g>

  <!-- ===== Room door, open 90°: x 0-760, y 1380-1424, z 0-2048 ===== -->
  <!-- Front face, y = 1424 -->
  <g transform="matrix(0.866 0.5 0 -1 -1233.2 712)">
    <rect class="e" x="0" y="0" width="760" height="2048" fill="#8fb3d9" stroke="#1f4e79"/>
  </g>
  <!-- Free edge, x = 760 -->
  <g transform="matrix(-0.866 0.5 0 -1 658.2 380)">
    <rect class="e" x="1380" y="0" width="44" height="2048" fill="#6f97c2" stroke="#1f4e79"/>
  </g>
  <!-- Top edge, z = 2048 -->
  <g transform="matrix(0.866 0.5 -0.866 0.5 0 -2048)">
    <rect class="e" x="0" y="1380" width="760" height="44" fill="#b5cde6" stroke="#1f4e79"/>
  </g>

  <!-- ===== Labels (at projected points) ===== -->
  <g font-size="95" fill="#222">
    <text x="1400" y="560">BACK BENCH, 780 high</text>
    <text x="1400" y="-1350">UPPER OPEN SHELVES</text>
    <line class="thin" x1="1380" y1="-1380" x2="560" y2="-1000" stroke="#222"/>
    <text x="-2300" y="-900">DOOR CUPBOARD</text>
    <line class="thin" x1="-1500" y1="-880" x2="-350" y2="-650" stroke="#222"/>
    <text x="-2900" y="400" fill="#1f4e79">ROOM DOOR (open)</text>
    <line class="thin" x1="-2050" y1="420" x2="-700" y2="300" stroke="#1f4e79"/>
    <text x="-1900" y="-250" fill="#444" font-size="80">doorway</text>
  </g>
</svg>
