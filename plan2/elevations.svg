<?xml version="1.0" encoding="UTF-8"?>
<!--
  Elevations, drawn to scale: 1 SVG unit = 1 mm.
  Ceiling height 2400. Bench height 780 from the floor.
  Room door leaf 760 × 2048. The frame height (2130) is assumed: 2048 plus the same ~82 frame as the sides.

  Elevation A: standing in the room, facing the back wall.
               Left of the drawing is the left wall (plan x = 0).
  Elevation B: standing in the room, facing the left wall.
               Left of the drawing is the front wall (plan y = 5717),
               right of the drawing is the back wall (plan y = 0).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-1300 -700 7600 7600" width="1140" height="1140"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="-1200" y="-550" font-size="120" font-weight="bold">Elevations 2: upper cupboard on the bench</text>
  <text x="-1200" y="-400" font-size="70" fill="#555">To scale, all dimensions in mm. Ceiling 2400, bench 780. Room door 760 × 2048; frame height assumed 2130.</text>

  <!-- ===================== Elevation A: facing the back wall ===================== -->
  <!-- Floor at y = 2400, ceiling at y = 0 -->
  <g transform="translate(0,200)">
    <text x="0" y="-80" font-size="95" font-weight="bold">A. Facing the back wall</text>

    <!-- Back wall surface -->
    <rect x="0" y="0" width="3838" height="2400" fill="#f4f2ee"/>
    <!-- Ceiling, floor and side walls -->
    <g fill="#555">
      <rect x="-100" y="-40" width="4038" height="40"/>
      <rect x="-100" y="2400" width="4038" height="60"/>
      <rect x="-100" y="0" width="100" height="2400"/>
      <rect x="3838" y="0" width="100" height="2400"/>
    </g>

    <!-- Tall cupboard front (its face at plan y = 1200), full height -->
    <rect x="0" y="0" width="500" height="2400"
          fill="#c9a877" stroke="#5a3f17" stroke-width="12"/>
    <text x="250" y="1100" font-size="70" text-anchor="middle">TALL</text>
    <text x="250" y="1180" font-size="70" text-anchor="middle">CUPBOARD</text>
    <text x="250" y="1260" font-size="55" text-anchor="middle">front, 500 wide</text>

    <!-- Back bench, top at 780 -->
    <rect x="500" y="1620" width="3338" height="780"
          fill="#e8d9bf" stroke="#7a5c2e" stroke-width="12"/>
    <text x="2169" y="2040" font-size="85" text-anchor="middle">BACK BENCH</text>
    <text x="2169" y="2130" font-size="65" text-anchor="middle">3338 long, top at 780</text>

    <!-- Upper cupboard on the bench: x 500-1200, from 780 to the ceiling.
         Door 676 × 1614 at x 521-1197, hinged on the right (x = 1200). -->
    <rect x="500" y="0" width="700" height="1620"
          fill="#c9a877" stroke="#5a3f17" stroke-width="12"/>
    <rect x="521" y="3" width="676" height="1614"
          fill="#d8bd92" stroke="#5a3f17" stroke-width="8"/>
    <polyline points="521,3 1197,810 521,1617" fill="none"
              stroke="#5a3f17" stroke-width="5" stroke-dasharray="30 20"/>
    <g fill="#333">
      <rect x="1190" y="150" width="14" height="100"/>
      <rect x="1190" y="1370" width="14" height="100"/>
      <rect x="538" y="1150" width="20" height="300" rx="8"/>
    </g>
    <text x="860" y="560" font-size="60" text-anchor="middle">UPPER</text>
    <text x="860" y="630" font-size="60" text-anchor="middle">CUPBOARD</text>
    <text x="860" y="710" font-size="45" text-anchor="middle">door 676 × 1614</text>

    <!-- Open door, in front of everything here (plan y 1380), shown as outline -->
    <rect x="0" y="352" width="760" height="2048"
          fill="none" stroke="#1f4e79" stroke-width="8" stroke-dasharray="40 25"/>
    <text x="780" y="440" font-size="55" fill="#1f4e79">open door, 760 wide,</text>
    <text x="780" y="510" font-size="55" fill="#1f4e79">nearer than the cupboard</text>

    <!-- Dimensions -->
    <g stroke="#333" stroke-width="6" fill="none">
      <line x1="0" y1="2650" x2="3838" y2="2650" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="0" y1="2520" x2="500" y2="2520" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="500" y1="2520" x2="3838" y2="2520" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="-400" y1="0" x2="-400" y2="2400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="4150" y1="1620" x2="4150" y2="2400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="4150" y1="0" x2="4150" y2="1620" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="3938" y1="1620" x2="4230" y2="1620" stroke-width="3"/>
      <line x1="-480" y1="0" x2="-100" y2="0" stroke-width="3"/>
      <line x1="-480" y1="2400" x2="-100" y2="2400" stroke-width="3"/>
      <line x1="500" y1="-200" x2="1200" y2="-200" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="1200" y1="-260" x2="1200" y2="-40" stroke-width="3"/>
      <line x1="500" y1="-260" x2="500" y2="-40" stroke-width="3"/>
    </g>
    <g font-size="80" fill="#222" text-anchor="middle">
      <text x="850" y="-225" font-size="65">700</text>
      <text x="1919" y="2760">3838</text>
      <text x="250" y="2500" font-size="65">500</text>
      <text x="2169" y="2500" font-size="65">3338</text>
      <text transform="translate(-430,1200) rotate(-90)">2400 ceiling</text>
      <text x="4220" y="2040" text-anchor="start">780</text>
      <text x="4220" y="850" text-anchor="start">1620</text>
      <text x="4220" y="930" text-anchor="start" font-size="55" fill="#555">above bench</text>
    </g>
  </g>

  <!-- ===================== Elevation B: facing the left wall ===================== -->
  <!-- Drawing x = 5717 - plan y. Floor at y = 2400, ceiling at y = 0. -->
  <g transform="translate(0,3700)">
    <text x="0" y="-80" font-size="95" font-weight="bold">B. Facing the left wall</text>
    <text x="0" y="-180" font-size="60" fill="#555">front wall ←                                                                            → back wall</text>

    <!-- Left wall surface, with the doorway cut out -->
    <rect x="0" y="0" width="5717" height="2400" fill="#f4f2ee"/>
    <!-- Doorway opening: plan y 1380-2304 -> x 3413-4337, 2130 high (assumed) -->
    <rect x="3413" y="270" width="924" height="2130" fill="#ffffff" stroke="#555" stroke-width="10"/>
    <!-- Ceiling, floor, front and back walls -->
    <g fill="#555">
      <rect x="-100" y="-40" width="5917" height="40"/>
      <rect x="-100" y="2400" width="5917" height="60"/>
      <rect x="-100" y="0" width="100" height="2400"/>
      <rect x="5717" y="0" width="100" height="2400"/>
    </g>

    <!-- Tall cupboard side: plan y 0-1200 -> x 4517-5717, full height -->
    <rect x="4517" y="0" width="1200" height="2400"
          fill="#c9a877" stroke="#5a3f17" stroke-width="12"/>
    <!-- Upper cupboard's end panel (plan x = 1200), nearer than the tall
         cupboard: plan y 0-500 -> x 5217-5717, from 780 to the ceiling. -->
    <rect x="5217" y="0" width="500" height="1620" fill="#bf9c68" stroke="#5a3f17" stroke-width="12"/>
    <text x="5467" y="700" font-size="55" text-anchor="middle">UPPER</text>
    <text x="5467" y="770" font-size="55" text-anchor="middle">CUPBOARD</text>
    <text x="5467" y="840" font-size="45" text-anchor="middle">end panel</text>
    <text x="5467" y="900" font-size="40" text-anchor="middle" fill="#333">500 deep</text>

    <!-- Corner space behind the bench end, below 780: part of the door
         cupboard, reached through its door. Hidden here by the bench end. -->
    <rect x="5217" y="1620" width="500" height="780" fill="none"
          stroke="#5a3f17" stroke-width="6" stroke-dasharray="25 18"/>

    <!-- Cupboard door on the exposed side: plan y 500-1200 -> x 4517-5217.
         700 × 2400 opening, door 694 × 2394 with 3 mm gaps.
         Hinged on the front edge (plan y 1200, drawing left). -->
    <rect x="4520" y="3" width="694" height="2394"
          fill="#d8bd92" stroke="#5a3f17" stroke-width="8"/>
    <!-- Opening symbol: lines meet at the hinge side -->
    <polyline points="5214,3 4520,1200 5214,2397" fill="none"
              stroke="#5a3f17" stroke-width="5" stroke-dasharray="30 20"/>
    <!-- Hinges -->
    <g fill="#333">
      <rect x="4514" y="150" width="14" height="100"/>
      <rect x="4514" y="1150" width="14" height="100"/>
      <rect x="4514" y="2150" width="14" height="100"/>
    </g>
    <!-- Handle, on the edge away from the hinges -->
    <rect x="5177" y="1150" width="20" height="300" rx="8" fill="#333"/>
    <text x="4900" y="1700" font-size="60" text-anchor="middle">CUPBOARD</text>
    <text x="4900" y="1770" font-size="60" text-anchor="middle">DOOR</text>
    <text x="4900" y="1850" font-size="50" text-anchor="middle">694 × 2394</text>
    <text x="4900" y="1920" font-size="45" text-anchor="middle">hinged front edge</text>

    <!-- Upper cupboard door, seen edge-on (nearer than the tall door):
         plan y 500-518 -> x 5199-5217, 783-2397 -->
    <rect x="5199" y="3" width="18" height="1614" fill="#d8bd92" stroke="#5a3f17" stroke-width="5"/>
    <text x="4900" y="2160" font-size="40" text-anchor="middle" fill="#5a3f17">below 780 the inside</text>
    <text x="4900" y="2210" font-size="40" text-anchor="middle" fill="#5a3f17">runs back to the wall →</text>

    <!-- Back bench end: plan y 0-500 -> x 5217-5717, 780 high, in front of the cupboard side -->
    <rect x="5217" y="1620" width="500" height="780"
          fill="#e8d9bf" stroke="#7a5c2e" stroke-width="12"/>
    <text x="5467" y="1760" font-size="50" text-anchor="middle">BENCH end</text>
    <text x="5467" y="1960" font-size="38" text-anchor="middle" fill="#5a3f17">behind: corner space,</text>
    <text x="5467" y="2010" font-size="38" text-anchor="middle" fill="#5a3f17">open to the door</text>
    <text x="5467" y="2060" font-size="38" text-anchor="middle" fill="#5a3f17">cupboard (dashed)</text>
    <!-- Redraw the hidden outline on top of the bench end -->
    <rect x="5217" y="1620" width="500" height="780" fill="none"
          stroke="#5a3f17" stroke-width="5" stroke-dasharray="25 18"/>

    <!-- Open door, seen edge-on: plan y 1380-1424 -> x 4293-4337, 2048 high -->
    <rect x="4293" y="352" width="44" height="2048" fill="#8fb3d9" stroke="#1f4e79" stroke-width="5"/>
    <text x="4160" y="700" font-size="55" fill="#1f4e79" text-anchor="end">open door,</text>
    <text x="4160" y="770" font-size="55" fill="#1f4e79" text-anchor="end">edge-on (44)</text>
    <text x="3875" y="1500" font-size="60" fill="#555" text-anchor="middle">DOORWAY</text>
    <text x="3875" y="1580" font-size="55" fill="#555" text-anchor="middle">924 × 2130 frame</text>

    <!-- Dimensions along the bottom (from the back wall, right to left) -->
    <g stroke="#333" stroke-width="6" fill="none">
      <line x1="4517" y1="2550" x2="5217" y2="2550" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="5217" y1="2550" x2="5717" y2="2550" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="4517" y1="3150" x2="5717" y2="3150" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="4337" y1="2550" x2="4517" y2="2550" marker-start="url(#arrow-small)" marker-end="url(#arrow-small)"/>
      <line x1="3413" y1="2550" x2="4337" y2="2550" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="0" y1="2750" x2="5717" y2="2750" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="4337" y1="2950" x2="5717" y2="2950" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <!-- Heights -->
      <line x1="-400" y1="0" x2="-400" y2="2400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="3300" y1="270" x2="3300" y2="2400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="4200" y1="352" x2="4200" y2="2400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="6000" y1="1620" x2="6000" y2="2400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="5817" y1="1620" x2="6080" y2="1620" stroke-width="3"/>
    </g>
    <g font-size="75" fill="#222" text-anchor="middle">
      <text x="4867" y="2530">700 door</text>
      <text x="5467" y="2530">500 upper cupbd</text>
      <text x="5117" y="3130">1200 cupboard</text>
      <text x="4427" y="2530" font-size="55">180</text>
      <text x="3875" y="2530">924</text>
      <text x="2858" y="2730">5717</text>
      <text x="5027" y="2930">1380 to hinge</text>
      <text transform="translate(-430,1200) rotate(-90)">2400 ceiling</text>
      <text transform="translate(3270,1350) rotate(-90)" font-size="60">2130 frame (assumed)</text>
      <text transform="translate(4170,1700) rotate(-90)" font-size="60" fill="#1f4e79">2048 door</text>
      <text x="6070" y="2040" text-anchor="start">780</text>
    </g>
  </g>
</svg>
