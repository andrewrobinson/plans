<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupboard options in 3D</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #eef0f2; font-family: Helvetica, Arial, sans-serif; }
  #view { position: fixed; inset: 0; }
  /* The settings are a drawer that slides in from the left, opened by the
     menu button. The model always fills the screen. */
  #panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: 340px; max-width: 88vw; overflow: auto; z-index: 3;
    background: rgba(255, 255, 255, 0.97); padding: 12px 14px 24px; box-sizing: border-box;
    box-shadow: 2px 0 14px rgba(0, 0, 0, 0.2); font-size: 13px; line-height: 1.45;
    transform: translateX(-105%); transition: transform 0.25s ease;
  }
  body.menu-open #panel { transform: none; }
  #panel h1 { font-size: 15px; margin: 0; }
  #panel .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  #panel #close { font-size: 18px; line-height: 1; padding: 4px 10px; }
  #bar {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #menu {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 10px; border: none; font-size: 22px;
    background: rgba(255, 255, 255, 0.95); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); cursor: pointer;
  }
  #share {
    pointer-events: auto; height: 44px; padding: 0 14px; border-radius: 10px; border: none; font: inherit; font-size: 14px;
    background: rgba(255, 255, 255, 0.95); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); cursor: pointer; flex: none;
  }
  #current {
    background: rgba(255, 255, 255, 0.9); border-radius: 8px; padding: 6px 10px; font-size: 13px;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.15); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* On phones the open drawer dims the model; tapping there closes it */
  #scrim { position: fixed; inset: 0; z-index: 2; background: rgba(0, 0, 0, 0.25); display: none; }
  @media (max-width: 900px) { body.menu-open #scrim { display: block; } }
  #panel label { display: block; margin: 8px 0 2px; font-weight: bold; }
  #panel input[type=range] { width: 100%; }
  #options { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  #options button { text-align: left; }
  #panel button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer; }
  #panel button.on { background: #1f4e79; color: #fff; border-color: #1f4e79; }
  #panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .depth { margin: 0 0 8px; }
  #panel .depth label { display: inline; margin: 0 0 0 10px; font-weight: normal; }
  #about { margin: 0 0 4px; }
  #about > summary { cursor: pointer; font-weight: bold; padding: 2px 0; }
  #summary { padding: 7px 9px; background: #f4efe6; border-radius: 6px; margin-top: 4px; }
  #summary .src { color: #777; font-size: 11px; margin-top: 4px; }
  #panel .hint { color: #666; font-size: 12px; margin-top: 8px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="bar">
  <button id="menu" aria-label="Settings" aria-controls="panel">☰</button>
  <button id="share">Share</button>
  <div id="current"></div>
</div>
<div id="scrim"></div>
<div id="panel">
  <div class="head">
    <h1>Cupboard options</h1>
    <button id="close" aria-label="Close settings">✕</button>
  </div>
  <div>Room 3838 × 5717, ceiling 2443. Sizes in mm. Keys 1–8 switch option.</div>

  <div id="options"></div>
  <div id="depth" class="depth">Left-wall cupboard depth:
    <label><input type="radio" name="depth" value="400"> 400</label>
    <label><input type="radio" name="depth" value="500" checked> 500</label>
    <label><input type="radio" name="depth" value="600"> 600</label>
    <label><input type="radio" name="depth" value="700"> 700</label>
    <label><input type="radio" name="depth" value="800"> 800</label>
  </div>
  <div id="front" class="depth">Left-wall cupboard front:
    <label><input type="radio" name="front" value="1200" checked> 1200</label>
    <label><input type="radio" name="front" value="1329"> 1329 (to the door frame)</label>
  </div>
  <div id="above" class="depth">Above the bench:
    <label><input type="radio" name="above" value="0" checked> Nothing</label>
    <label><input type="radio" name="above" value="1"> Shelves</label>
    <label><input type="radio" name="above" value="2"> TV</label>
    <label><input type="radio" name="above" value="3"> TV and shelves</label>
  </div>
  <div id="upperBlock">
    <label for="upper">Upper cupboard width: <span id="upperValue">700</span></label>
    <input id="upper" type="range" min="400" max="1200" step="50" value="700">
  </div>
  <div id="legBlock">
    <label for="leg">Back-wall leg width: <span id="legValue">700</span></label>
    <input id="leg" type="range" min="400" max="1200" step="50" value="700">
  </div>
  <div id="extraBlock">
    <label for="extra">Option 5 second bay: <span id="extraValue">500</span></label>
    <input id="extra" type="range" min="300" max="900" step="50" value="500">
  </div>
  <label for="shelfDepth">Shelf depth: <span id="shelfDepthValue">250</span></label>
  <input id="shelfDepth" type="range" min="150" max="400" step="10" value="250">
  <div id="bench" class="depth">Bench height:
    <label><input type="radio" name="bench" value="700"> 700</label>
    <label><input type="radio" name="bench" value="780" checked> 780</label>
    <label><input type="radio" name="bench" value="800"> 800</label>
    <label><input type="radio" name="bench" value="900"> 900</label>
  </div>
  <div id="rear" class="depth">Rear wall cupboard depth:
    <label><input type="radio" name="rear" value="330"> 330</label>
    <label><input type="radio" name="rear" value="400"> 400</label>
    <label><input type="radio" name="rear" value="500" checked> 500</label>
    <label><input type="radio" name="rear" value="600"> 600</label>
    <label><input type="radio" name="rear" value="700"> 700</label>
    <label><input type="radio" name="rear" value="800"> 800</label>
  </div>
  <details id="about">
    <summary>Description</summary>
    <div id="summary"></div>
  </details>

  <div id="tallBlock">
    <label for="tallDoor">Left-wall cupboard door: <span id="tallDoorValue">0°</span></label>
    <input id="tallDoor" type="range" min="0" max="110" value="0">
  </div>

  <div id="secondBlock">
    <label for="secondDoor"><span id="secondLabel"></span>: <span id="secondDoorValue">0°</span></label>
    <input id="secondDoor" type="range" min="0" max="110" value="0">
  </div>

  <label for="roomDoor">Room door: <span id="roomDoorValue">90°</span></label>
  <input id="roomDoor" type="range" min="0" max="110" value="90">

  <div class="row">
    <button id="mode">Show 2D</button>
    <button id="xray">See-through cupboards: off</button>
  </div>
  <div class="row">
    <button data-view="corner" data-mode="3d">Corner view</button>
    <button data-view="top" data-mode="3d">Top</button>
    <button data-view="plan" data-mode="2d">Plan</button>
    <button data-view="back" data-mode="2d">Back wall</button>
    <button data-view="left" data-mode="2d">Left wall</button>
    <button id="dims" data-mode="2d">Dimensions: on</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Room coordinates in mm: x along the back wall from the left wall, y from
// the back wall towards the front, z up. The scene is y-up in metres:
// room (x, y, z) -> scene (x, z, y).
const MM = 0.001;
const W = 3838, D = 5717, H = 2443, WALL = 100;   // H: ceiling, measured 2441-2446 across the room
let BENCH = 780;                   // bench height: 700, 780, 800 or 900, from the radio buttons

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f2);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.getElementById('view').appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// The 2D views: a parallel projection, to scale, with panning and zooming
// but no rotating
const flatCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const flatControls = new OrbitControls(flatCamera, renderer.domElement);
flatControls.enableRotate = false;
flatControls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
flatControls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
flatControls.enabled = false;
let flat = false;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a890, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 6, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 });
scene.add(sun);

const material = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.8 });
const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x3b2a12 });
const carcassMat = material(0xc9a877);
const shelfMat = material(0xd6bc8f);
const doorMat = material(0xd8bd92);
const handleMat = material(0x333333);
const benchMat = material(0xe8d9bf);

// A box from room corner (x0, y0, z0) to (x1, y1, z1), in mm.
function box(x0, y0, z0, x1, y1, z1, mat, parent, edges = true) {
  const g = new THREE.BoxGeometry((x1 - x0) * MM, (z1 - z0) * MM, (y1 - y0) * MM);
  const m = new THREE.Mesh(g, mat);
  m.position.set((x0 + x1) / 2 * MM, (z0 + z1) / 2 * MM, (y0 + y1) / 2 * MM);
  m.castShadow = m.receiveShadow = true;
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMaterial));
  parent.add(m);
  return m;
}

// A flat slab from z0 to z1 whose plan is the polygon `points` ([x, y] in mm)
function slab(points, z0, z1, mat, parent) {
  const shape = new THREE.Shape(points.map(([x, y]) => new THREE.Vector2(x * MM, y * MM)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: (z1 - z0) * MM, bevelEnabled: false });
  g.rotateX(Math.PI / 2);                                       // plan (x, y) -> scene (x, z), extruded downwards
  const m = new THREE.Mesh(g, mat);
  m.position.y = z1 * MM;
  m.castShadow = m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMaterial));
  parent.add(m);
  return m;
}

// A door that turns about a vertical hinge at room (hx, hy). The door's
// boxes are given in mm relative to the hinge.
function hinge(hx, hy, parent) {
  const g = new THREE.Group();
  g.position.set(hx * MM, 0, hy * MM);
  parent.add(g);
  return g;
}

// As hinge(), but the door's own x axis runs at `degrees` from the room's x
// axis, turning from +x towards -y. `dir` sets which way the slider opens it.
function skewHinge(hx, hy, degrees, dir, parent) {
  const outer = hinge(hx, hy, parent);
  outer.rotation.y = THREE.MathUtils.degToRad(degrees);
  const inner = new THREE.Group();
  inner.userData.dir = dir;
  outer.add(inner);
  return inner;
}

// ---------------------------------------------------------------------------
// The room, the same in every option
// ---------------------------------------------------------------------------
const wallMat = material(0xf2efe9);
box(0, 0, -20, W, D, 0, material(0xd9d3c5), scene, false);          // floor
box(-WALL, -WALL, 0, W + WALL, 0, H, wallMat, scene, false);         // back wall
// The doorway: the frame starts 1329 from the back wall, the furthest a
// cupboard on the left wall can come. The door hinges at 1400, so the frame
// is 71 each side of the door; the far side is assumed to match. The frame
// is 2050 high and the door 1978, both measured to the floor.
const FRAME = 1329, HINGE = 1400, ROOM_DOOR = 760, JAMB = HINGE - FRAME;
const FRAME_H = 2050, ROOM_DOOR_H = 1978;
const FRAME_END = HINGE + ROOM_DOOR + JAMB;                          // 2231
const frameMat = material(0xffffff);
box(-WALL, 0, 0, 0, FRAME, H, wallMat, scene, false);                // left wall, behind the doorway
box(-WALL, FRAME_END, 0, 0, D, H, wallMat, scene, false);            // left wall, in front of it
box(-WALL, FRAME, FRAME_H, 0, FRAME_END, H, wallMat, scene, false);     // over the doorway
box(-WALL, FRAME, 0, 0, HINGE, FRAME_H, frameMat, scene);               // frame, hinge side
box(-WALL, FRAME_END - JAMB, 0, 0, FRAME_END, FRAME_H, frameMat, scene); // frame, far side
box(-WALL, HINGE, ROOM_DOOR_H, 0, FRAME_END - JAMB, FRAME_H, frameMat, scene); // frame head, down to the door

// Room door: 760 x 44 x 1978, hinged at (0, 1400), opens into the room
const roomHinge = hinge(0, HINGE, scene);
box(-44, 0, 0, 0, ROOM_DOOR, ROOM_DOOR_H, material(0x8fb3d9), roomHinge);
box(0, 600, 1000, 60, 720, 1020, handleMat, roomHinge, false);

// ---------------------------------------------------------------------------
// The left-wall cupboard's depth from the wall, T: 400 to 800 in 100s. Everything
// along the back wall starts from it, so it is set before an option is built.
// ---------------------------------------------------------------------------
let T = 500;

// The rear-wall cupboards' and bench's depth from the back wall, R: 330, or 400
// to 800 in 100s.
let R = 500;

// The left-wall cupboard's front, F: 1200, or 1329 right up to the door
// frame. Its inside leg along the left wall is F - R.
let F = 1200;

// Option 4's upper cupboard width along the back wall, from the slider: 400
// to 1200. Options 3 and 5 are built on it. Its door is UPPER - 24 wide.
let UPPER = 700;

// Option 7's back-wall leg, inside along the back wall, from the slider: 400
// to 1200. Its door is LEG - 24 wide. Options 6 and 8 keep 700.
let LEG = 700;

// Option 5's second bay, beyond option 4's upper cupboard: its width from the slider,
// 300 to 900. Its door is EXTRA - 6 wide.
let EXTRA = 500;

// ---------------------------------------------------------------------------
// Parts shared by options 1-5
// ---------------------------------------------------------------------------

// The tall cupboard on the left wall, x 0-T, y 0-F, full height. Its
// door is on the exposed side (x = T, y R to F), hinged at the front
// (y = F). Below the bench top, its inside runs back to the back wall,
// behind the bench end. Returns the door's hinge.
function tallCupboard(g) {
  box(0, F - 18, 0, T, F, H, carcassMat, g);                   // front end
  box(0, 0, H - 18, T, F, H, carcassMat, g);                 // top
  box(0, 0, 0, T, F, 18, carcassMat, g);                     // bottom
  box(0, R, BENCH, T, R + 18, H - 18, carcassMat, g);            // divider, above the bench top only
  box(T - 18, 0, 18, T, R, BENCH - 18, carcassMat, g);        // side behind the bench end
  for (const top of [1203, 1803]) box(0, R + 18, top - 18, T - 18, F - 18, top, carcassMat, g);
  return tallDoor(g);
}

// Left-wall cupboard door: (F - 6 - R) x (H - 6) on x T to T + 18, y R + 3 to
// F - 3, hinged at y = F
function tallDoor(g) {
  const h = hinge(T, F, g);
  const w = F - 6 - R;
  box(0, -w - 3, 3, 18, -3, H - 3, doorMat, h);
  box(18, -w + 17, 950, 40, -w + 37, 1250, handleMat, h, false); // handle near the free edge, 950-1250
  return h;
}

// The corner above the bench (x 0-T, y 0-R): backing panel against the
// left wall, and shelves at BENCH (base) and upperTops(). `to` is where the
// upper shelves end: T for the corner alone, further when they run on into
// an upper cupboard on the bench.
function cornerShelves(g, to) {
  box(0, 0, BENCH, 18, R, H - 18, carcassMat, g);             // backing
  box(18, 0, BENCH - 18, T, R, BENCH, shelfMat, g);           // base, level with the bench top
  for (const top of upperTops()) box(18, 0, top - 18, to, R, top, shelfMat, g);
}

// Shelf tops above the bench in the corner and upper units: 1203, 1608 and
// 2013 with the bench at 780
const upperTops = () => [BENCH + 423, BENCH + 828, BENCH + 1233];

// The upper unit on the bench, x T to T + UPPER, from the bench top to the ceiling
function upperUnit(g) {
  box(T + UPPER - 18, 0, BENCH, T + UPPER, R, H - 18, carcassMat, g); // end panel
  box(T, 0, H - 18, T + UPPER, R, H, carcassMat, g);          // top
}

// The full-height L of option 7: legs inside LEG along the back wall (x 0 to
// T + LEG) and F - R along the left wall (y 0-F), one space round the corner,
// bench from x = T + LEG. Returns the back-wall leg door's hinge.
function fullHeightL(g) {
  const E = T + LEG;
  box(E, 0, 0, W, R, BENCH, benchMat, g);
  box(0, F - 18, 0, T, F, H, carcassMat, g);                // left-wall leg front end
  box(E - 18, 0, 0, E, R, H, carcassMat, g);               // back-wall leg end
  box(0, 0, H - 18, E, R, H, carcassMat, g);               // tops
  box(0, R, H - 18, T, F - 18, H, carcassMat, g);
  box(0, 0, 0, E - 18, R, 18, carcassMat, g);              // bottoms
  box(0, R, 0, T, F - 18, 18, carcassMat, g);
  for (const top of [600, 1200, 1800]) {
    box(0, 0, top - 18, E - 18, R - 18, top, carcassMat, g);
    box(0, R - 18, top - 18, T - 18, F - 18, top, carcassMat, g);
  }
  const second = hinge(E, R + 18, g);
  box(T + 21 - E, -18, 3, -3, 0, H - 3, doorMat, second);
  box(T + 38 - E, 0, 950, T + 58 - E, 22, 1250, handleMat, second, false);
  return second;
}

// Option 8's diagonal front, from (T, F) to (T + 700, R): its length, its
// direction (ux, uy) from the left end, each door's width, and the angle
// for skewHinge() at the left end.
function diagonal() {
  const dx = 700, dy = R - F;
  const length = Math.hypot(dx, dy);
  const ux = dx / length, uy = dy / length;
  return { length, ux, uy, door: (length - 9) / 2, angle: THREE.MathUtils.radToDeg(Math.atan2(-uy, ux)) };
}

// The gap between option 8's left door, opened to 90°, and the open room
// door (y 1400-1444, x 0-760); below 0 they clash. The open door points
// straight out from the front, so sample its outline there.
function roomDoorGap() {
  const { ux, uy, door } = diagonal();
  const ox = -uy, oy = ux;                                      // out of the cupboard
  let nearest = Infinity;
  for (let a = 3; a <= 3 + door; a += 1) {
    for (const b of [0, -18]) {                                 // the door's two faces, 18 apart
      const x = T + a * ox + b * ux, y = F + a * oy + b * uy;
      if (y >= HINGE && y <= HINGE + 44) nearest = Math.min(nearest, x);
    }
  }
  return nearest === Infinity ? Infinity : Math.round(nearest - 760);
}

// ---------------------------------------------------------------------------
// Above the bench, on the clear back wall from x0 to W: nothing, three
// shelves, a TV, or a TV with shelves either side. Each option's clearFrom()
// gives x0, where its cupboards above the bench end (benchFrom() is where the
// bench itself starts). Returns a sentence for
// the summary.
// ---------------------------------------------------------------------------
let above = 0;                     // 0 nothing, 1 shelves, 2 TV, 3 TV and shelves
let shelfDepth = 250;              // 150 to 400, from the slider
const SHELF_T = 25, TV_W = 1450, TV_H = 830, TV_GAP = 150;         // a 65" TV
// Heights above the bench, set from BENCH by benchHeights(). With the bench
// at 780: shelves at 1200, 1550, 1900; the TV from 1100 to 1930; with the TV,
// a bottom shelf at 1000 under it and a top one at 2080 over it, both right
// across, and a middle one at 1550 beside it.
let SHELF_TOPS, TV_BOTTOM, TV_SHELF_TOPS, TV_MIDDLE_SHELF;
function benchHeights() {
  SHELF_TOPS = [BENCH + 420, BENCH + 770, BENCH + 1120];
  TV_BOTTOM = BENCH + 320;
  TV_SHELF_TOPS = [BENCH + 220, BENCH + 1300];
  TV_MIDDLE_SHELF = BENCH + 770;
}
benchHeights();
const tvMat = material(0x1a1a1a);
const screenMat = new THREE.MeshStandardMaterial({ color: 0x0c1824, roughness: 0.3, metalness: 0.2 });

function shelves(x0, x1, g, tops = SHELF_TOPS) {
  for (const top of tops) box(x0, 0, top - SHELF_T, x1, shelfDepth, top, shelfMat, g);
}

function benchWall(x0, g) {
  const span = W - x0;
  if (above === 0) return '';
  return benchWallItems(x0, span, g) +
    (shelfDepth > R && above !== 2 ? ` The shelves stand ${shelfDepth - R} proud of the ${R}-deep bench.` : '');
}

function benchWallItems(x0, span, g) {
  if (above === 1) {
    shelves(x0, W, g);
    return ` Above the bench: three ${shelfDepth}-deep shelves, ${span} long, at ${SHELF_TOPS.join(', ')}.`;
  }
  if (span < TV_W + 20) {                                         // the TV doesn't fit beside the cupboards
    const none = ` Above the bench: no room for the ${TV_W} TV, only ${span} of clear wall.`;
    if (above === 2) return none;
    shelves(x0, W, g, TV_SHELF_TOPS);
    return none + ` ${shelfDepth}-deep shelves right across, ${span} long, at ${TV_SHELF_TOPS[0]} and ${TV_SHELF_TOPS[1]}.`;
  }
  const tx = x0 + (span - TV_W) / 2;                               // centred on the clear wall
  box(tx, 0, TV_BOTTOM, tx + TV_W, 50, TV_BOTTOM + TV_H, tvMat, g);
  box(tx + 15, 50, TV_BOTTOM + 15, tx + TV_W - 15, 52, TV_BOTTOM + TV_H - 15, screenMat, g, false);
  const tvText = ` Above the bench: a 65" TV (${TV_W} × ${TV_H}), centred on the ${span} of clear wall, from ${TV_BOTTOM} to ${TV_BOTTOM + TV_H}.`;
  if (above === 2) return tvText;
  shelves(x0, W, g, TV_SHELF_TOPS);
  const shelfText = ` ${shelfDepth}-deep shelves right across, ${span} long, below it at ${TV_SHELF_TOPS[0]} and above it at ${TV_SHELF_TOPS[1]}.`;
  const side = Math.floor((span - TV_W) / 2 - TV_GAP);
  if (side < 200) return tvText + shelfText + ` No room for a middle shelf beside it: only ${Math.max(side, 0)} each side.`;
  shelves(x0, x0 + side, g, [TV_MIDDLE_SHELF]);
  shelves(W - side, W, g, [TV_MIDDLE_SHELF]);
  return tvText + shelfText + ` A middle shelf at ${TV_MIDDLE_SHELF} either side, ${side} long, ${TV_GAP} clear of the TV.`;
}

// ---------------------------------------------------------------------------
// Dimensions for the 2D views, drawn from the current option and settings
// ---------------------------------------------------------------------------
const dimMat = new THREE.LineBasicMaterial({ color: 0x9b1c1c, depthTest: false });
let showDims = true;
let flatView = null;               // 'plan', 'back' or 'left' while 2D
let dims = null;                   // the group of dimensions on show

// Room (x, y, z) in mm to a scene point
const P = (x, y, z) => new THREE.Vector3(x * MM, z * MM, y * MM);

function dimLine(points, g) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), dimMat);
  l.renderOrder = 10;
  g.add(l);
}

function dimLabel(text, at, g) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 40px Helvetica, Arial, sans-serif';
  canvas.width = Math.ceil(ctx.measureText(text).width) + 12;
  canvas.height = 48;
  ctx.font = 'bold 40px Helvetica, Arial, sans-serif';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#9b1c1c';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 6, 25);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
  sprite.scale.set(0.13 * canvas.width / canvas.height, 0.13, 1);
  sprite.position.copy(at);
  sprite.renderOrder = 11;
  g.add(sprite);
}

// A chain of dimensions between successive values in `at` (mm). place(v, off)
// gives the scene point for value v, `off` mm out from the chain's line.
function chain(at, place, g) {
  const v = [...new Set(at.map(Math.round))].sort((a, b) => a - b);
  dimLine([place(v[0], 0), place(v[v.length - 1], 0)], g);
  for (const x of v) dimLine([place(x, -40), place(x, 40)], g);
  // Labels on short neighbouring gaps would overlap, so every other one moves further out
  for (let i = 1; i < v.length; i++) {
    const len = v[i] - v[i - 1];
    dimLabel(String(len), place((v[i] + v[i - 1]) / 2, len < 250 && i % 2 ? 260 : 110), g);
  }
}

// Heights of what's above the bench: shelf tops, and the TV's bottom and top
function aboveHeights(x0) {
  const tv = [TV_BOTTOM, TV_BOTTOM + TV_H];
  if (above === 1) return SHELF_TOPS;
  if (above === 2) return tv;
  if (above === 3) {
    const side = Math.floor((W - x0 - TV_W) / 2 - TV_GAP);
    return [...TV_SHELF_TOPS, ...tv, ...(side >= 200 ? [TV_MIDDLE_SHELF] : [])];
  }
  return [];
}

function updateDims() {
  if (dims) scene.remove(dims);
  dims = null;
  if (!flat || !showDims || !flatView) return;
  dims = new THREE.Group();
  scene.add(dims);
  const option = OPTIONS[shown];
  const alongBack = [0, T, option.benchFrom(), option.clearFrom(), W];
  const alongLeft = [0, R, F, FRAME, HINGE, HINGE + ROOM_DOOR, FRAME_END];
  if (flatView === 'plan') {
    chain(alongBack, (v, off) => P(v, -250 - off, H), dims);
    chain([...alongLeft, D], (v, off) => P(-300 - off, v, H), dims);
    chain([0, W], (v, off) => P(v, D + 250 + off, H), dims);
    chain([0, R, ...(above === 1 || above === 3 ? [shelfDepth] : []), D], (v, off) => P(W + 250 + off, v, H), dims);
  } else if (flatView === 'back') {
    chain(alongBack, (v, off) => P(v, D, -200 - off), dims);
    chain([0, BENCH, ...aboveHeights(option.clearFrom()), H], (v, off) => P(W + 250 + off, D, v), dims);
  } else if (flatView === 'left') {
    chain(alongLeft, (v, off) => P(W, v, -200 - off), dims);
    chain([0, ROOM_DOOR_H, FRAME_H, H], (v, off) => P(W, FRAME_END + 300 + off, v), dims);
    chain([0, BENCH, H], (v, off) => P(W, -250 - off, v), dims);
  }
}

    if (current.tall) current.tall.rotation.y = -THREE.MathUtils.degToRad(Number(tallSlider.value));
    for (const s of [].concat(current.second ?? [])) s.rotation.y = (s.userData.dir ?? 1) * THREE.MathUtils.degToRad(Number(secondSlider.value));
  }
  roomHinge.rotation.y = THREE.MathUtils.degToRad(Number(roomSlider.value));
  document.getElementById('tallDoorValue').textContent = `${tallSlider.value}°`;
  document.getElementById('secondDoorValue').textContent = `${secondSlider.value}°`;
  document.getElementById('roomDoorValue').textContent = `${roomSlider.value}°`;
}

// Build option i. A new option starts with its second door shut; rebuilding
// the same one (a size changed) leaves the doors as they were.
function show(i) {
  const option = OPTIONS[i];
  const same = i === shown && current;
  shown = i;
  if (current) scene.remove(current.group);
  const group = new THREE.Group();
  scene.add(group);
  current = { group, ...option.build(group) };
  const aboveText = benchWall(option.clearFrom(), group);

  buttons.forEach((b, j) => b.classList.toggle('on', i === j));
  document.getElementById('current').textContent = option.name;
  document.getElementById('summary').innerHTML =
    `${option.summary()}${aboveText}<div class="src">From ${option.source}</div>`;
  document.getElementById('tallBlock').style.display = current.tall ? '' : 'none';
  document.getElementById('upperBlock').style.display = i >= 2 && i <= 4 ? '' : 'none';
  document.getElementById('extraBlock').style.display = i === 4 ? '' : 'none';
  document.getElementById('legBlock').style.display = i === 6 ? '' : 'none';
  document.getElementById('secondBlock').style.display = option.second ? '' : 'none';
  document.getElementById('secondLabel').textContent = option.second || '';
  if (!same) secondSlider.value = 0;
  updateDims();
  try { location.hash = `${i + 1}-${T}-${R}-${F}-${above}-${shelfDepth}-${BENCH}-${EXTRA}-${UPPER}-${LEG}`; } catch (e) { /* not important */ }
  update();
}

// 3D views place the perspective camera. 2D views place the flat one and
// give the width and height (m) to fit on screen.
const views = {
  corner: { position: [4.6, 3.4, 5.4], target: [1.0, 1.0, 1.0] },
  top:    { position: [1.92, 9.5, 2.9], target: [1.92, 0, 2.86] },
  plan:   { position: [1.9, 20, 2.861], target: [1.9, 0, 2.86], fit: [5.0, 6.9] },    // back wall at the top
  back:   { position: [1.9, 1.0, 30], target: [1.9, 1.0, 0], fit: [5.0, 3.2] },       // facing the back wall
  left:   { position: [30, 1.0, 1.1], target: [0, 1.0, 1.1], fit: [3.6, 3.2] },       // facing the left wall, back wall on the right
};
let flatFit = views.plan.fit;

function setView(name) {
  const v = views[name];
  setFlat(Boolean(v.fit));
  const [cam, ctl] = flat ? [flatCamera, flatControls] : [camera, controls];
  cam.position.set(...v.position);
  ctl.target.set(...v.target);
  flatView = flat ? name : null;
  updateDims();
  if (flat) {
    flatFit = v.fit;
    flatCamera.zoom = 1;
    resize();
  }
  ctl.update();
}

function setFlat(on) {
  flat = on;
  controls.enabled = !on;
  flatControls.enabled = on;
  document.getElementById('mode').textContent = on ? 'Show 3D' : 'Show 2D';
  document.querySelectorAll('[data-mode]').forEach(b => { b.style.display = b.dataset.mode === (on ? '2d' : '3d') ? '' : 'none'; });
  document.getElementById('hint').textContent = on
    ? 'Drag to pan, scroll or pinch to zoom.'
    : 'Drag to rotate, scroll or pinch to zoom, right-drag to pan.';
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('dims').addEventListener('click', e => {
  showDims = !showDims;
  e.target.textContent = `Dimensions: ${showDims ? 'on' : 'off'}`;
  updateDims();
});
document.getElementById('mode').addEventListener('click', () => setView(flat ? 'corner' : 'plan'));
setView('corner');

function resize() {
  const { clientWidth: w, clientHeight: h } = renderer.domElement.parentElement;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // On narrow screens, keep about 55° across rather than 45° up and down, so
  // the room isn't cropped at the sides
  camera.fov = w / h < 1.4 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(27.5)) * h / w)) : 45;
  camera.updateProjectionMatrix();
  // Fit flatFit on screen, whichever way round is tighter
  const [fw, fh] = flatFit;
  const halfH = Math.max(fh, fw * h / w) / 2, halfW = halfH * w / h;
  Object.assign(flatCamera, { left: -halfW, right: halfW, top: halfH, bottom: -halfH });
  flatCamera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// The settings drawer: open on wide screens to start with, closed on phones

  document.body.classList.toggle('menu-open', open);

}

  };
  if (navigator.share && narrow()) {
    try { await navigator.share({ title: document.title, text: OPTIONS[shown].name, url }); } catch (err) { /* closed without sharing */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    said('Link copied');
  } catch (err) {
    window.prompt('Copy this link:', url);
  }
});
resize();

// Start on the option, sizes and what's above the bench in the address
// (#option-left-rear-front-above-shelf-bench-extra-upper-leg, e.g.
// #8-700-600-1329-3-250-780-500-700-700), or option 1 at 500, 500 and 1200
// with nothing above the bench
const [start, depth, rear, front, aboveIn, shelfIn, benchIn, extraIn, upperIn, legIn] = location.hash.slice(1).split('-').map(Number);
if (legIn >= 400 && legIn <= 1200) {
  LEG = legIn;
  legSlider.value = legIn;
  document.getElementById('legValue').textContent = legIn;
}
if (upperIn >= 400 && upperIn <= 1200) {
  UPPER = upperIn;
  upperSlider.value = upperIn;
  document.getElementById('upperValue').textContent = upperIn;
}
if (extraIn >= 300 && extraIn <= 900) {
  EXTRA = extraIn;
  extraSlider.value = extraIn;
  document.getElementById('extraValue').textContent = extraIn;
}
const benchRadio = document.querySelector(`input[name=bench][value="${benchIn}"]`);
if (benchRadio) {
  BENCH = benchIn;
  benchRadio.checked = true;
  benchHeights();
}
if (shelfIn >= 150 && shelfIn <= 400) {
  shelfDepth = shelfIn;
  shelfSlider.value = shelfIn;
  document.getElementById('shelfDepthValue').textContent = shelfIn;
}
const aboveRadio = document.querySelector(`input[name=above][value="${aboveIn}"]`);
if (aboveRadio) {
  above = aboveIn;
  aboveRadio.checked = true;
}
const frontRadio = document.querySelector(`input[name=front][value="${front}"]`);
if (frontRadio) {
  F = front;
  frontRadio.checked = true;
}
const depthRadio = document.querySelector(`input[name=depth][value="${depth}"]`);
if (depthRadio) {
  T = depth;
  depthRadio.checked = true;
}
const rearRadio = document.querySelector(`input[name=rear][value="${rear}"]`);
if (rearRadio) {
  R = rear;
  rearRadio.checked = true;
}
show(start >= 1 && start <= OPTIONS.length ? start - 1 : 0);
renderer.setAnimationLoop(() => {
  (flat ? flatControls : controls).update();
  renderer.render(scene, flat ? flatCamera : camera);
});
</script>
</body>
</html>
