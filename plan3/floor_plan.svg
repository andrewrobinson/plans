<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plan 3: the L-shaped cupboard is full height on both legs.
  Back-wall leg x 0-1200, y 0-500; tall leg x 0-500, y 0-1200; both 0-2400.
  The bench starts at x = 1200. To scale, 1 unit = 1 mm.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1300 -1100 6300 7100" width="900" height="1015"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="-1200" y="-950" font-size="130" font-weight="bold">Plan 3: full-height L, bench from 1200</text>
  <text x="-1200" y="-800" font-size="70" fill="#555">To scale, mm. Room 3838 × 5717, ceiling 2400. Both cupboard legs floor to ceiling.</text>

  <!-- Floor and walls (gap in the left wall for the doorway, 1380-2304) -->
  <rect x="0" y="0" width="3838" height="5717" fill="#fbfaf7"/>
  <g fill="#555">
    <rect x="-100" y="-100" width="4038" height="100"/>
    <rect x="-100" y="5717" width="4038" height="100"/>
    <rect x="3838" y="-100" width="100" height="5917"/>
    <rect x="-100" y="-100" width="100" height="1480"/>
    <rect x="-100" y="2304" width="100" height="3513"/>
  </g>

  <!-- Bench, x 1200-3838 -->
  <rect x="1200" y="0" width="2638" height="500" fill="#e8d9bf" stroke="#7a5c2e" stroke-width="12"/>
  <text x="2519" y="230" font-size="85" text-anchor="middle">BENCH</text>
  <text x="2519" y="340" font-size="65" text-anchor="middle">2638 × 500, 780 high</text>

  <!-- L-shaped cupboard, full height: one outline, cross marks a tall unit -->
  <path d="M0,0 H1200 V500 H500 V1200 H0 Z" fill="#c9a877" stroke="#5a3f17" stroke-width="12"/>
  <g stroke="#5a3f17" stroke-width="5">
    <line x1="0" y1="0" x2="1200" y2="500"/><line x1="1200" y1="0" x2="0" y2="500"/>
    <line x1="0" y1="500" x2="500" y2="1200"/><line x1="500" y1="500" x2="0" y2="1200"/>
  </g>
  <text x="250" y="880" font-size="55" text-anchor="middle">FULL-HEIGHT</text>
  <text x="250" y="950" font-size="55" text-anchor="middle">L CUPBOARD</text>

  <!-- Tall leg door: x = 500, y 503-1197, hinged at (500, 1200), open 90° -->
  <rect x="500" y="503" width="18" height="694" fill="none" stroke="#5a3f17" stroke-width="4" stroke-dasharray="20 15"/>
  <rect x="500" y="1200" width="694" height="18" fill="#d8bd92" stroke="#5a3f17" stroke-width="5"/>
  <path d="M500,503 A697,697 0 0 1 1197,1200" fill="none" stroke="#5a3f17" stroke-width="5" stroke-dasharray="35 25"/>
  <circle cx="500" cy="1200" r="14" fill="#5a3f17"/>

  <!-- Back-wall leg door: y = 500, x 521-1197 (676 wide), hinged at (1200, 518), open 90° -->
  <rect x="521" y="500" width="676" height="18" fill="none" stroke="#5a3f17" stroke-width="4" stroke-dasharray="20 15"/>
  <rect x="1182" y="521" width="18" height="676" fill="#d8bd92" stroke="#5a3f17" stroke-width="5"/>
  <path d="M521,518 A679,679 0 0 0 1200,1197" fill="none" stroke="#5a3f17" stroke-width="5" stroke-dasharray="35 25"/>
  <circle cx="1200" cy="518" r="14" fill="#5a3f17"/>
  <text x="1260" y="620" font-size="50" fill="#5a3f17">door 676 wide</text>
  <text x="1260" y="1300" font-size="50" fill="#5a3f17">door 694 wide</text>

  <!-- Room door: 760 x 44, hinged at (0, 1380), open 90° -->
  <rect x="0" y="1380" width="760" height="44" fill="#8fb3d9" stroke="#1f4e79" stroke-width="6"/>
  <rect x="-44" y="1380" width="44" height="760" fill="none" stroke="#1f4e79" stroke-width="5" stroke-dasharray="25 20"/>
  <path d="M760,1380 A760,760 0 0 1 0,2140" fill="none" stroke="#1f4e79" stroke-width="6" stroke-dasharray="40 30"/>
  <circle cx="0" cy="1380" r="18" fill="#1f4e79"/>
  <text x="900" y="1700" font-size="60" fill="#1f4e79">ROOM DOOR 760</text>

  <text x="1900" y="3600" font-size="110" fill="#aaa" text-anchor="middle">CLEAR FLOOR</text>

  <!-- Dimensions -->
  <g stroke="#333" stroke-width="6" fill="none">
    <line x1="0" y1="-450" x2="3838" y2="-450" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="0" y1="-260" x2="500" y2="-260" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="500" y1="-260" x2="1200" y2="-260" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="1200" y1="-260" x2="3838" y2="-260" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="0" y1="-520" x2="0" y2="-120" stroke-width="3"/>
    <line x1="500" y1="-330" x2="500" y2="-120" stroke-width="3"/>
    <line x1="1200" y1="-330" x2="1200" y2="-120" stroke-width="3"/>
    <line x1="3838" y1="-520" x2="3838" y2="-120" stroke-width="3"/>
    <line x1="-300" y1="0" x2="-300" y2="500" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="-300" y1="500" x2="-300" y2="1200" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="-700" y1="0" x2="-700" y2="1380" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="-380" y1="500" x2="0" y2="500" stroke-width="3"/>
    <line x1="-380" y1="1200" x2="0" y2="1200" stroke-width="3"/>
    <line x1="-780" y1="1380" x2="-100" y2="1380" stroke-width="3"/>
  </g>
  <g font-size="75" fill="#222" text-anchor="middle">
    <text x="1919" y="-480">3838</text>
    <text x="250" y="-290" font-size="60">500</text>
    <text x="850" y="-290" font-size="60" fill="#c0392b">700</text>
    <text x="2519" y="-290" font-size="60">2638</text>
    <text transform="translate(-330,250) rotate(-90)" font-size="60">500</text>
    <text transform="translate(-330,850) rotate(-90)" font-size="60" fill="#c0392b">700</text>
    <text transform="translate(-730,690) rotate(-90)" font-size="60">1380 to room door hinge</text>
  </g>

  <!-- Notes -->
  <g font-size="60" fill="#333">
    <text x="1300" y="4300">Inside legs of the L: 700 along the back wall, 700 along the left wall.</text>
    <text x="1300" y="4400">Bench: 2638 long, from x = 1200.</text>
    <text x="1300" y="4500">Back-wall leg door: 676 wide.</text>
    <text x="1300" y="4600">Both doors open from the inside corner: open one at a time.</text>
  </g>
</svg>
